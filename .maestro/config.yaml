# `maestro test .maestro` runs the top-level flows in this order (subflows/ are helpers only).
flows:
  - "*"
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - smoke
    - settings
    - profile
    - timing-window
    - speed-control
    - endless
    - song-folder
    - full-round
    - screenshots
